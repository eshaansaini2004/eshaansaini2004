<svg width="800" height="130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="vinyl-clip">
      <circle cx="65" cy="65" r="52"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="130" fill="#000000"/>
  <rect width="800" height="130" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Spinning vinyl record -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 65 65" to="360 65 65" dur="5s" repeatCount="indefinite"/>
    <circle cx="65" cy="65" r="52" fill="#0d0d0d" stroke="#222" stroke-width="1"/>
    <circle cx="65" cy="65" r="44" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="65" cy="65" r="36" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="65" cy="65" r="28" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="65" cy="65" r="20" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Green label -->
    <circle cx="65" cy="65" r="13" fill="#1DB954"/>
    <!-- Center hole -->
    <circle cx="65" cy="65" r="4" fill="#000000"/>
  </g>

  <!-- NOW PLAYING -->
  <text x="138" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9" fill="#555555" letter-spacing="2.5">NOW PLAYING</text>

  <!-- Song title -->
  <text x="138" y="58" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" fill="#ffffff" font-weight="700">The Less I Know The Better</text>

  <!-- Artist -->
  <text x="138" y="78" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#666666">Tame Impala</text>

  <!-- Animated equalizer bars (right side) -->
  <g transform="translate(590, 90)">
    <rect x="0"   y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.9" transform="scale(1,-1)">
      <animate attributeName="height" values="5;30;12;28;8;30;5"  dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="9"   y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.85" transform="scale(1,-1)">
      <animate attributeName="height" values="30;8;25;5;30;15;30" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="18"  y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.8" transform="scale(1,-1)">
      <animate attributeName="height" values="12;30;5;20;30;8;12" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="27"  y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.75" transform="scale(1,-1)">
      <animate attributeName="height" values="28;5;30;10;25;30;28" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="36"  y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.7" transform="scale(1,-1)">
      <animate attributeName="height" values="8;25;30;8;20;5;8"   dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="45"  y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.65" transform="scale(1,-1)">
      <animate attributeName="height" values="30;12;5;30;10;28;30" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="54"  y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.6" transform="scale(1,-1)">
      <animate attributeName="height" values="15;30;20;5;30;12;15" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="63"  y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.55" transform="scale(1,-1)">
      <animate attributeName="height" values="5;20;30;15;5;30;5"  dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="72"  y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.5" transform="scale(1,-1)">
      <animate attributeName="height" values="25;8;30;20;10;30;25" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="81"  y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.45" transform="scale(1,-1)">
      <animate attributeName="height" values="30;5;18;30;5;22;30"  dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="90"  y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.4" transform="scale(1,-1)">
      <animate attributeName="height" values="10;30;8;25;30;10;10" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="99"  y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.35" transform="scale(1,-1)">
      <animate attributeName="height" values="28;10;30;5;28;20;28" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="108" y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.3" transform="scale(1,-1)">
      <animate attributeName="height" values="5;28;15;30;8;25;5"   dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="117" y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.2" transform="scale(1,-1)">
      <animate attributeName="height" values="20;5;30;12;30;8;20"  dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="126" y="0" width="5" height="30" rx="2.5" fill="#ffffff" opacity="0.12" transform="scale(1,-1)">
      <animate attributeName="height" values="30;20;5;28;12;30;30" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Spotify logo -->
  <circle cx="765" cy="22" r="12" fill="#1DB954"/>
  <text x="765" y="26.5" text-anchor="middle" fill="white" font-size="11" font-family="Arial">♪</text>

  <!-- Progress track -->
  <rect x="138" y="103" width="608" height="2" rx="1" fill="#1a1a1a"/>
  <!-- Progress fill -->
  <rect x="138" y="103" width="295" height="2" rx="1" fill="#ffffff"/>
  <!-- Dot -->
  <circle cx="433" cy="104" r="4" fill="#ffffff"/>

  <!-- Time labels -->
  <text x="138" y="118" font-family="monospace" font-size="9" fill="#444444">1:48</text>
  <text x="746" y="118" font-family="monospace" font-size="9" fill="#444444" text-anchor="end">3:37</text>
</svg>
