  <!-- Spotify logo (right side) -->
  <!-- Green circle -->
  <circle cx="690" cy="72" r="38" fill="#1DB954"/>
  <!-- Three arcs (white, Spotify style) -->
  <path d="M 665,55 Q 690,44 715,55" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 669,67 Q 690,58 711,67" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M 673,79 Q 690,72 707,79" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
