<svg width="800" height="160" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="800" height="160" fill="#000000"/>
  <rect width="800" height="160" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Album art -->
  <rect x="12" y="12" width="136" height="136" rx="6" fill="#0d0d0d" stroke="#222" stroke-width="1"/>
  <!-- Album art design: concentric circles -->
  <circle cx="80" cy="80" r="50" fill="none" stroke="#1a1a1a" stroke-width="8"/>
  <circle cx="80" cy="80" r="36" fill="none" stroke="#1a1a1a" stroke-width="6"/>
  <circle cx="80" cy="80" r="22" fill="none" stroke="#222" stroke-width="5"/>
  <circle cx="80" cy="80" r="10" fill="#1DB954"/>
  <circle cx="80" cy="80" r="4"  fill="#000"/>
  <!-- Album label text -->
  <text x="80" y="28" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="8" fill="#333" letter-spacing="1">TAME IMPALA</text>

  <!-- Song title -->
  <text x="165" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" fill="#cccccc" font-weight="600">The Less I Know The Better</text>

  <!-- Artist -->
  <text x="165" y="75" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#666666">Tame Impala</text>

