<svg width="420" height="90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <clipPath id="art">
      <rect x="16" y="16" width="58" height="58" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="420" height="90" rx="12" fill="url(#bg)"/>
  <rect width="420" height="90" rx="12" fill="none" stroke="#2a2a3e" stroke-width="1"/>

  <!-- Album art -->
  <rect x="16" y="16" width="58" height="58" rx="4" fill="#1a0a2e"/>
  <circle cx="45" cy="45" r="25" fill="#2d1b4e" clip-path="url(#art)"/>
  <circle cx="45" cy="45" r="14" fill="#1DB954" opacity="0.8" clip-path="url(#art)"/>
  <circle cx="45" cy="45" r="6" fill="#0d0d1a" clip-path="url(#art)"/>
  <circle cx="31" cy="31" r="9" fill="#ff6b6b" opacity="0.35" clip-path="url(#art)"/>
  <circle cx="60" cy="59" r="11" fill="#ffd93d" opacity="0.25" clip-path="url(#art)"/>

  <!-- Spotify dot top right -->
  <circle cx="395" cy="16" r="9" fill="#1DB954"/>
  <text x="395" y="20" text-anchor="middle" fill="white" font-size="9" font-family="Arial">♪</text>

  <!-- Now Playing label -->
  <text x="90" y="29" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" fill="#b3b3b3" letter-spacing="1.5" font-weight="500">NOW PLAYING</text>

  <!-- Song name -->
  <text x="90" y="50" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#ffffff" font-weight="700">The Less I Know The Better</text>

  <!-- Artist -->
  <text x="90" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#b3b3b3">Tame Impala</text>

  <!-- Animated equalizer bars using SMIL -->
  <rect x="90" y="76" width="3" height="8" rx="1.5" fill="#1DB954">
    <animate attributeName="height" values="2;8;4;8;2" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="82;76;78;76;82" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="95" y="76" width="3" height="8" rx="1.5" fill="#1DB954">
    <animate attributeName="height" values="8;2;8;4;8" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="76;82;76;80;76" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="76" width="3" height="8" rx="1.5" fill="#1DB954">
    <animate attributeName="height" values="4;8;2;8;4" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="80;76;82;76;80" dur="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="105" y="76" width="3" height="8" rx="1.5" fill="#1DB954">
    <animate attributeName="height" values="8;4;8;2;8" dur="1.0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="76;80;76;82;76" dur="1.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="110" y="76" width="3" height="8" rx="1.5" fill="#1DB954">
    <animate attributeName="height" values="2;8;4;6;2" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="82;76;80;78;82" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Progress bar track -->
  <rect x="90" y="79" width="305" height="2" rx="1" fill="#333355"/>
  <!-- Progress fill (about halfway) -->
  <rect x="90" y="79" width="148" height="2" rx="1" fill="#1DB954"/>
  <!-- Progress dot -->
  <circle cx="238" cy="80" r="4" fill="#ffffff"/>

  <!-- Time labels -->
  <text x="90" y="90" font-family="monospace" font-size="9" fill="#777799">1:48</text>
  <text x="385" y="90" font-family="monospace" font-size="9" fill="#777799" text-anchor="end">3:37</text>
</svg>
