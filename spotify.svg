<svg width="420" height="90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="art">
      <rect x="16" y="16" width="58" height="58" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background: pure black -->
  <rect width="420" height="90" rx="10" fill="#000000"/>
  <rect width="420" height="90" rx="10" fill="none" stroke="#333333" stroke-width="1"/>

  <!-- Album art placeholder -->
  <rect x="16" y="16" width="58" height="58" rx="4" fill="#111111" stroke="#333333" stroke-width="1"/>
  <!-- Psychedelic circles for Tame Impala vibe, black/white -->
  <circle cx="45" cy="45" r="22" fill="none" stroke="#ffffff" stroke-width="1.5" clip-path="url(#art)" opacity="0.6"/>
  <circle cx="45" cy="45" r="14" fill="none" stroke="#ffffff" stroke-width="1.5" clip-path="url(#art)" opacity="0.4"/>
  <circle cx="45" cy="45" r="6" fill="#ffffff" clip-path="url(#art)" opacity="0.8"/>
  <circle cx="45" cy="45" r="2" fill="#000000" clip-path="url(#art)"/>

  <!-- Spotify icon (green, kept as brand color) -->
  <circle cx="396" cy="15" r="9" fill="#1DB954"/>
  <text x="396" y="19" text-anchor="middle" fill="white" font-size="9" font-family="Arial">♪</text>

  <!-- NOW PLAYING label -->
  <text x="90" y="29" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9" fill="#666666" letter-spacing="2" font-weight="500">NOW PLAYING</text>

  <!-- Song name -->
  <text x="90" y="49" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#ffffff" font-weight="700">The Less I Know The Better</text>

  <!-- Artist -->
  <text x="90" y="65" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12" fill="#888888">Tame Impala</text>

  <!-- Animated equalizer bars (SMIL) — white -->
  <rect x="90" y="74" width="3" height="8" rx="1.5" fill="#ffffff">
    <animate attributeName="height" values="2;8;4;8;2" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="80;74;76;74;80" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="95" y="74" width="3" height="8" rx="1.5" fill="#ffffff">
    <animate attributeName="height" values="8;2;8;4;8" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="74;80;74;78;74" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="100" y="74" width="3" height="8" rx="1.5" fill="#ffffff">
    <animate attributeName="height" values="4;8;2;8;4" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="78;74;80;74;78" dur="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="105" y="74" width="3" height="8" rx="1.5" fill="#ffffff">
    <animate attributeName="height" values="8;4;8;2;8" dur="1.0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="74;78;74;80;74" dur="1.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="110" y="74" width="3" height="8" rx="1.5" fill="#ffffff">
    <animate attributeName="height" values="2;8;4;6;2" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="80;74;78;76;80" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Progress bar track -->
  <rect x="90" y="79" width="305" height="1.5" rx="1" fill="#333333"/>
  <!-- Progress fill -->
  <rect x="90" y="79" width="148" height="1.5" rx="1" fill="#ffffff"/>
  <!-- Progress dot -->
  <circle cx="238" cy="79.75" r="3.5" fill="#ffffff"/>

  <!-- Time -->
  <text x="90" y="90" font-family="monospace" font-size="9" fill="#555555">1:48</text>
  <text x="385" y="90" font-family="monospace" font-size="9" fill="#555555" text-anchor="end">3:37</text>
</svg>
